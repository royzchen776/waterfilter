      { id: 'sch_4', houseId: 'jiao', houseName: '交響樂', device: '廚下RO 第5道', stage: 'ST椰殼', stockId: 'STK_ST_COCO', batchQty: 1, cycleMonths: 12, lastDate: '2026-11-01', nextDate: '2027-11-01' },
      { id: 'sch_5', houseId: 'jiao', houseName: '交響樂', device: '廚下RO 第6道', stage: 'ST活性碳', stockId: 'STK_ST_CARB', batchQty: 1, cycleMonths: 12, lastDate: '2026-11-01', nextDate: '2027-11-01' },

      { id: 'sch_7', houseId: 'haitian', houseName: '海天', device: '全戶前置', stage: '10吋大胖', stockId: 'STK_BIG10', batchQty: 1, cycleMonths: 6, lastDate: '2026-08-01', nextDate: '2027-02-01' },
      { id: 'sch_8', houseId: 'haitian', houseName: '海天', device: '廚下RO 第1道', stage: 'PP-5', stockId: 'STK_PP5', batchQty: 1, cycleMonths: 6, lastDate: '2026-08-01', nextDate: '2027-02-01' },
      { id: 'sch_9', houseId: 'haitian', houseName: '海天', device: '廚下RO 第2/3道', stage: 'CTO-2X', stockId: 'STK_CTO2X', batchQty: 2, cycleMonths: 6, lastDate: '2026-08-01', nextDate: '2027-02-01' },
      { id: 'sch_10', houseId: 'haitian', houseName: '海天', device: '廚下RO 第5道', stage: 'ST椰殼', stockId: 'STK_ST_COCO', batchQty: 1, cycleMonths: 12, lastDate: '2026-08-01', nextDate: '2027-08-01' },
      { id: 'sch_11', houseId: 'haitian', houseName: '海天', device: '廚下RO 第6道', stage: 'ST活性碳', stockId: 'STK_ST_CARB', batchQty: 1, cycleMonths: 12, lastDate: '2026-08-01', nextDate: '2027-08-01' },

      // 澎湖鎖港
      { id: 'sch_13', houseId: 'suogang', houseName: '澎湖鎖港', device: '廚下RO 第1道', stage: 'PP-5', stockId: 'STK_PP5', batchQty: 1, cycleMonths: 4, lastDate: '2026-08-01', nextDate: '2026-11-01' },
      { id: 'sch_14', houseId: 'suogang', houseName: '澎湖鎖港', device: '廚下RO 第2/3道', stage: 'CTO-2X', stockId: 'STK_CTO2X', batchQty: 2, cycleMonths: 6, lastDate: '2026-08-01', nextDate: '2027-02-01' },
      { id: 'sch_15', houseId: 'suogang', houseName: '澎湖鎖港', device: '廚下RO 第5道', stage: 'ST椰殼', stockId: 'STK_ST_COCO', batchQty: 1, cycleMonths: 12, lastDate: '2026-02-01', nextDate: '2027-02-01' },
      { id: 'sch_16', houseId: 'suogang', houseName: '澎湖鎖港', device: '廚下RO 第6道', stage: 'ST活性碳', stockId: 'STK_ST_CARB', batchQty: 1, cycleMonths: 12, lastDate: '2026-02-01', nextDate: '2027-02-01' },
      { id: 'sch_17', houseId: 'suogang', houseName: '澎湖鎖港', device: '廚下RO 第7道', stage: 'ST麥飯石', stockId: 'STK_ST_MIN', batchQty: 1, cycleMonths: 12, lastDate: '2026-02-01', nextDate: '2027-02-01' },
      { id: 'sch_18', houseId: 'suogang', houseName: '澎湖鎖港', device: '廚下RO 第4道', stage: 'RO膜', stockId: 'STK_RO_MEM', batchQty: 1, cycleMonths: 36, lastDate: '2024-04-01', nextDate: '2027-04-01' },
      
      // 澎湖阿姨家
      { id: 'sch_19', houseId: 'aunt', houseName: '澎湖阿姨家', device: '廚下RO 第1道', stage: 'PP-5', stockId: 'STK_PP5', batchQty: 1, cycleMonths: 4, lastDate: '2026-08-01', nextDate: '2026-11-01' },
      { id: 'sch_20', houseId: 'aunt', houseName: '澎湖阿姨家', device: '廚下RO 第2/3道', stage: 'CTO-2X', stockId: 'STK_CTO2X', batchQty: 2, cycleMonths: 6, lastDate: '2026-08-01', nextDate: '2027-02-01' },
      { id: 'sch_21', houseId: 'aunt', houseName: '澎湖阿姨家', device: '廚下RO 第5道', stage: 'ST椰殼', stockId: 'STK_ST_COCO', batchQty: 1, cycleMonths: 12, lastDate: '2026-02-01', nextDate: '2027-02-01' },
      { id: 'sch_22', houseId: 'aunt', houseName: '澎湖阿姨家', device: '廚下RO 第6道', stage: 'ST活性碳', stockId: 'STK_ST_CARB', batchQty: 1, cycleMonths: 12, lastDate: '2026-02-01', nextDate: '2027-02-01' },
      { id: 'sch_23', houseId: 'aunt', houseName: '澎湖阿姨家', device: '廚下RO 第4道', stage: 'RO膜', stockId: 'STK_RO_MEM', batchQty: 1, cycleMonths: 36, lastDate: '2026-02-01', nextDate: '2029-02-01' }
    ];

    function addMonths(dateStr, months) {
      const d = new Date(dateStr);
      d.setMonth(d.getMonth() + parseInt(months, 10));
      return d.toISOString().split('T')[0];
    }

    function getDaysDiff(targetDateStr) {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const target = new Date(targetDateStr);
      target.setHours(0, 0, 0, 0);
      return Math.round((target - today) / (1000 * 60 * 60 * 24));
    }

    // --- 主應用組件 ---
    function App() {
      // 驗證狀態
      const [currentUser, setCurrentUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      const [unauthorizedEmail, setUnauthorizedEmail] = useState(null);

      const [stocks, setStocks] = useState(INITIAL_STOCKS);
      const [schedules, setSchedules] = useState(INITIAL_SCHEDULES);
      const [logs, setLogs] = useState([]);
      const [syncStatus, setSyncStatus] = useState('connecting'); // 'online' | 'local' | 'connecting'

      const [activeTab, setActiveTab] = useState('schedule');
      const [filterHouse, setFilterHouse] = useState('ALL');
      const [replaceModal, setReplaceModal] = useState(null);
      const [transferModal, setTransferModal] = useState(null);
      const [toast, setToast] = useState(null);

      const showToast = (msg, type = 'success') => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 3000);
      };

      // =========================================================================
      // 2. 監聽 Firebase 驗證狀態 (Auth State)
      // =========================================================================
      useEffect(() => {
        if (!auth) {
          setAuthLoading(false);
          return;
        }

        const unsubscribeAuth = auth.onAuthStateChanged(async (user) => {
          if (user) {
            const normalizedList = ALLOWED_EMAILS.map(e => e.trim().toLowerCase());
            const userEmail = (user.email || "").trim().toLowerCase();
            // 若尚未修改預設範例信箱，暫時放行並顯示設定提醒；一旦填入真實信箱則嚴格執行白名單比對
            const isPlaceholder = normalizedList.length === 1 && normalizedList[0] === "wx9950a@gmail.com";
            
            if (!isPlaceholder && !normalizedList.includes(userEmail)) {
              setUnauthorizedEmail(user.email);
              await auth.signOut();
              setCurrentUser(null);
              setAuthLoading(false);
              return;
            }
            setUnauthorizedEmail(null);
          }
          setCurrentUser(user);
          setAuthLoading(false);
        });

        return () => unsubscribeAuth();
      }, []);

      // Google 登入處理 (支援行動裝置 Popup 或 Redirect)
      const handleGoogleLogin = async () => {
        if (!auth || !googleProvider) {
          showToast("Firebase Auth 尚未就緒", "error");
          return;
        }
        setUnauthorizedEmail(null);
        try {
          await auth.signInWithPopup(googleProvider);
        } catch (err) {
          console.error("Google login error:", err);
          if (err.code === "auth/popup-blocked" || err.code === "auth/popup-closed-by-user") {
            // 若手機瀏覽器封鎖彈窗，改採轉址登入
            auth.signInWithRedirect(googleProvider);
          } else {
            showToast(`登入失敗: ${err.message}`, "error");
          }
        }
      };

      // 登出處理
      const handleLogout = async () => {
        if (auth) {
          await auth.signOut();
          showToast("已成功登出");
        }
      };

      // =========================================================================
      // 3. Firestore 實時監聽 (僅在登入後觸發，符合安全規則)
      // =========================================================================
      useEffect(() => {
        if (!currentUser) return; // 未登入不發起監聽
        if (!isFirebaseReady || !db) return;

        setSyncStatus('connecting');

        // 監聽 1: 庫存池 (stocks)
        const unsubStocks = db.collection('filter_stocks').onSnapshot(async (snapshot) => {
          if (snapshot.empty) {
            console.log("Seeding initial stocks to Firestore...");
            const batch = db.batch();
            INITIAL_STOCKS.forEach(item => {
              const ref = db.collection('filter_stocks').doc(item.id);
              batch.set(ref, item);
            });
            await batch.commit();
          } else {
            const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            setStocks(data);
            setSyncStatus('online');
          }
        }, (err) => {
          console.error("Firestore stocks sync error:", err);
          setSyncStatus('local');
        });

        // 監聽 2: 排程清單 (schedules)
        const unsubSchedules = db.collection('maintenance_schedules').onSnapshot(async (snapshot) => {
          if (snapshot.empty) {
            console.log("Seeding initial schedules to Firestore...");
            const batch = db.batch();
            INITIAL_SCHEDULES.forEach(item => {
              const ref = db.collection('maintenance_schedules').doc(item.id);
              batch.set(ref, item);
            });
            await batch.commit();
          } else {
            const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            setSchedules(data);
          }
        }, (err) => {
          console.error("Firestore schedules sync error:", err);
        });

        // 監聽 3: 更換履歷 (logs)
        const unsubLogs = db.collection('maintenance_logs').orderBy('timestamp', 'desc').limit(50).onSnapshot((snapshot) => {
          const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          setLogs(data);
        }, (err) => {
          console.error("Firestore logs sync error:", err);
        });

        return () => {
          unsubStocks();
          unsubSchedules();
          unsubLogs();
        };
      }, [currentUser]);

      // 統計數據
      const stats = useMemo(() => {
        let expired = 0;
        let dueSoon = 0;
        schedules.forEach(s => {
          const diff = getDaysDiff(s.nextDate);
          if (diff < 0) expired++;
          else if (diff <= 30) dueSoon++;
        });
        return { expired, dueSoon, total: schedules.length };
      }, [schedules]);

      // =========================================================================
      // 4. 現場更換濾心並自動扣庫存 (Transaction)
      // =========================================================================
      const handleConfirmReplace = async (sourceLocation, notes = '') => {
        if (!replaceModal) return;
        const sch = replaceModal;
        const stock = stocks.find(s => s.id === sch.stockId);
        if (!stock) return;

        const needed = sch.batchQty;
        const currentQty = sourceLocation === 'central' ? stock.central : (stock.locations[sourceLocation] || 0);

        if (currentQty < needed) {
          showToast(`庫存不足！該位置僅有 ${currentQty} ${stock.unit}，需要 ${needed} ${stock.unit}`, 'error');
          return;
        }

        const todayStr = new Date().toISOString().split('T')[0];
        const nextDateStr = addMonths(todayStr, sch.cycleMonths);

        if (syncStatus === 'online' && db) {
          try {
            await db.runTransaction(async (transaction) => {
              const stockRef = db.collection('filter_stocks').doc(stock.id);
              const scheduleRef = db.collection('maintenance_schedules').doc(sch.id);
              const newLogRef = db.collection('maintenance_logs').doc();

              const stockDoc = await transaction.get(stockRef);
              if (!stockDoc.exists) throw new Error("庫存資料不存在！");

              const sData = stockDoc.data();
              let newCentral = sData.central;
              let newLocations = { ...sData.locations };

              if (sourceLocation === 'central') {
                if (newCentral < needed) throw new Error("中央庫存不足！");
                newCentral -= needed;
              } else {
                if ((newLocations[sourceLocation] || 0) < needed) throw new Error("現場庫存不足！");
                newLocations[sourceLocation] -= needed;
              }

              transaction.update(stockRef, { central: newCentral, locations: newLocations });
              transaction.update(scheduleRef, {
                lastDate: todayStr,
                nextDate: nextDateStr
              });
              transaction.set(newLogRef, {
                timestamp: new Date().toLocaleString(),
                operatorEmail: currentUser?.email || 'unknown',
                houseName: sch.houseName,
                device: sch.device,
                stage: sch.stage,
                stockName: stock.name,
                qty: needed,
                source: sourceLocation === 'central' ? '中央待入庫' : INITIAL_HOUSES.find(h => h.id === sourceLocation)?.name,
                notes: notes || '例行更換'
              });
            });

            setReplaceModal(null);
            showToast(`☁️ 雲端同步完成！成功更換並扣庫存，下次預計 ${nextDateStr}`);
          } catch (err) {
            console.error("Replace transaction failed:", err);
            showToast(`更換失敗: ${err.message}`, 'error');
          }
        }
      };

      // =========================================================================
      // 5. 跨房屋調撥庫存 (Transaction)
      // =========================================================================
      const handleTransferStock = async (stockId, fromLoc, toLoc, qty) => {
        const amount = parseInt(qty, 10);
        if (isNaN(amount) || amount <= 0) {
          showToast('請輸入有效數量', 'error');
          return;
        }

        const stock = stocks.find(s => s.id === stockId);
        if (!stock) return;

        const fromQty = fromLoc === 'central' ? stock.central : (stock.locations[fromLoc] || 0);
        if (fromQty < amount) {
          showToast('轉出點庫存不足！', 'error');
          return;
        }

        if (syncStatus === 'online' && db) {
          try {
            await db.runTransaction(async (transaction) => {
              const stockRef = db.collection('filter_stocks').doc(stockId);
              const doc = await transaction.get(stockRef);
              if (!doc.exists) throw new Error("耗材不存在！");

              const s = doc.data();
              let newCentral = s.central;
              let newLocs = { ...s.locations };

              if (fromLoc === 'central') newCentral -= amount;
              else newLocs[fromLoc] = (newLocs[fromLoc] || 0) - amount;

              if (toLoc === 'central') newCentral += amount;
              else newLocs[toLoc] = (newLocs[toLoc] || 0) + amount;

              transaction.update(stockRef, { central: newCentral, locations: newLocs });
            });

            setTransferModal(null);
            showToast(`☁️ 雲端調撥成功！${stock.name} x${amount} 已更新`);
          } catch (err) {
            console.error("Transfer failed:", err);
            showToast(`調撥失敗: ${err.message}`, 'error');
          }
        }
      };

      const filteredSchedules = useMemo(() => {
        return schedules
          .filter(s => filterHouse === 'ALL' || s.houseId === filterHouse)
          .sort((a, b) => new Date(a.nextDate) - new Date(b.nextDate));
      }, [schedules, filterHouse]);

      // --- 驗證中狀態 ---
      if (authLoading) {
        return (
          <div className="min-h-screen flex flex-col items-center justify-center p-4">
            <div className="w-10 h-10 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mb-3"></div>
            <p className="text-xs text-slate-500 font-medium">系統安全連線中...</p>
          </div>
        );
      }

      // --- 未登入：Google 授權登入畫面 ---

                    <label className="text-[11px] font-semibold text-slate-600 block mb-1">轉入點 (To)</label>
                    <select id="transferToSelect" className="w-full text-xs p-2 bg-slate-50 border border-slate-300 rounded-lg">
                      <option value="suogang">澎湖鎖港</option>
                      <option value="aunt">澎湖阿姨家</option>
                      <option value="jiao">交響樂</option>
                      <option value="haitian">海天</option>
                      <option value="central">中央待入庫</option>
                    </select>
                  </div>
                </div>

                <div>
                  <label className="text-[11px] font-semibold text-slate-600 block mb-1">調撥數量 ({transferModal.unit})</label>
                  <input
                    type="number"
                    id="transferQtyInput"
                    defaultValue="1"
                    min="1"
                    className="w-full text-xs p-2.5 bg-slate-50 border border-slate-300 rounded-lg font-bold"
                  />
                </div>

                <div className="flex gap-2 pt-1">
                  <button
                    onClick={() => setTransferModal(null)}
                    className="flex-1 py-2.5 rounded-lg border border-slate-200 text-xs font-medium text-slate-600"
                  >
                    取消
                  </button>
                  <button
                    onClick={() => {
                      const fromLoc = document.getElementById('transferFromSelect').value;
                      const toLoc = document.getElementById('transferToSelect').value;
                      const qty = document.getElementById('transferQtyInput').value;
                      if (fromLoc === toLoc) {
                        showToast('轉出點與轉入點不能相同', 'error');
                        return;
                      }
                      handleTransferStock(transferModal.id, fromLoc, toLoc, qty);
                    }}
                    className="flex-1 py-2.5 rounded-lg bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold shadow-md"
                  >
                    確認調撥
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 底部導航列 (Bottom Navigation) */}
          <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-slate-200 flex justify-around py-2 z-40 shadow-lg">
            <button
              onClick={() => setActiveTab('schedule')}
              className={`flex flex-col items-center gap-0.5 text-[10px] font-medium transition ${
                activeTab === 'schedule' ? 'text-blue-600 font-bold' : 'text-slate-400'
              }`}
            >
              <span className="text-lg">📋</span>
              <span>維護排程</span>
            </button>
            <button
              onClick={() => setActiveTab('stock')}
              className={`flex flex-col items-center gap-0.5 text-[10px] font-medium transition ${
                activeTab === 'stock' ? 'text-blue-600 font-bold' : 'text-slate-400'
              }`}
            >
              <span className="text-lg">📦</span>
              <span>耗材庫存</span>
            </button>
            <button
              onClick={() => setActiveTab('penghu')}
              className={`flex flex-col items-center gap-0.5 text-[10px] font-medium transition ${
                activeTab === 'penghu' ? 'text-blue-600 font-bold' : 'text-slate-400'
              }`}
            >
              <span className="text-lg">✈️</span>
              <span>澎湖備料</span>
            </button>
            <button
              onClick={() => setActiveTab('history')}
              className={`flex flex-col items-center gap-0.5 text-[10px] font-medium transition ${
                activeTab === 'history' ? 'text-blue-600 font-bold' : 'text-slate-400'
              }`}
            >
              <span className="text-lg">📝</span>
              <span>更換日誌</span>
            </button>
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
